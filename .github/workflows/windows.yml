name: Build and release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build installer and update package
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Expected a stable tag such as v1.0.0."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./scripts/package.ps1 -Version $version
          "PACKAGE_DIR=artifacts/release-$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: PrimeWatcher-Windows-x64
          path: |
            ${{ env.PACKAGE_DIR }}/PrimeWatcher-Setup.exe
            ${{ env.PACKAGE_DIR }}/*.nupkg
            ${{ env.PACKAGE_DIR }}/releases.win-x64.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrimeWatcher-Windows-x64
          path: packages
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [[ "$state" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" packages/* --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Prime Watcher ${tag#v}" --generate-notes packages/*
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
